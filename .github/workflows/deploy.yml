name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        env:
          RUSTFLAGS: "-A warnings" # 忽略所有依賴套件的警告，只對你的主專案進行 -D warnings 檢查
        run: cargo clippy --all-targets -- -D warnings

      - name: Install wasm-pack
        run: curl "https://rustwasm.github.io/wasm-pack/installer/init.sh" -sSf | sh

      - name: Run Unit & Integration Tests (WASM)
        run: wasm-pack test --firefox --headless

      - name: Install Trunk
        run: |
          curl -L "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xzf - -C /usr/local/bin
          trunk --version

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Project
        run: trunk build --release --public-url /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
